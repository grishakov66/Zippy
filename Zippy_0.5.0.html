<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101b2b">
<title>Zippy 0.2</title>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}
html,body{
 margin:0;
 height:100%;
 overflow:hidden;
 font-family:system-ui,Arial,sans-serif;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:active{transform:scale(.98)}
[hidden]{display:none!important}

#app{
 --bg:#101b2b;
 --panel:#1c2b3e;
 --panel2:#293e55;
 --text:#f5f8ff;
 --muted:#9baec3;
 --line:#ffffff15;
 --accent:#45a6ff;
 --purple:#aa83ff;
 background:var(--bg);
 color:var(--text);
 height:100dvh;
 display:flex;
 flex-direction:column;
}

#app.light{
 --bg:#f3f6fb;
 --panel:#fff;
 --panel2:#e6edf6;
 --text:#22324b;
 --muted:#74859a;
 --line:#1d344b17;
 --accent:#2686df;
 --purple:#9165d7;
}

#app.pink{
 --bg:#fff0f6;
 --panel:#fffafd;
 --panel2:#f7dce8;
 --text:#563449;
 --muted:#967a8b;
 --line:#65374c1a;
 --accent:#ce70a3;
 --purple:#ac6ab7;
}

#app.green{
 --bg:#354735;
 --panel:#465a43;
 --panel2:#526a4e;
 --text:#e1e9d9;
 --muted:#afc4a8;
 --line:#e1e9d921;
 --accent:#a1c49b;
 --purple:#c2abd9;
}

header{
 height:62px;
 flex:none;
 display:flex;
 align-items:center;
 gap:12px;
 padding:10px 18px;
}
header h1{
 font-size:23px;
 margin:0;
 flex:1;
}
main{
 flex:1;
 overflow-y:auto;
 padding:0 16px 118px;
 min-height:0;
}
.iconbtn{
 border:0;
 background:none;
 color:var(--text);
 font-size:26px;
 padding:4px 10px;
}

#bottom{
 position:fixed;
 bottom:calc(16px + env(safe-area-inset-bottom));
 left:50%;
 transform:translateX(-50%);
 width:92%;
 max-width:520px;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:36px;
 padding:6px;
 box-shadow:0 10px 30px #0003;
 z-index:10;
}
.navbtn{
 border:0;
 background:none;
 color:var(--muted);
 border-radius:28px;
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:4px;
 padding:8px 2px;
 font-size:11px;
}
.navbtn.active{
 background:var(--panel2);
 color:var(--accent);
}
.navbtn svg{
 width:25px;
 height:25px;
}
svg.ico{
 width:23px;
 height:23px;
 fill:none;
 stroke:currentColor;
 stroke-width:1.8;
 stroke-linecap:round;
 stroke-linejoin:round;
 flex:none;
}

.card{
 background:var(--panel);
 border-radius:18px;
 overflow:hidden;
 margin:14px 0;
}
.cell{
 width:100%;
 min-height:65px;
 display:flex;
 align-items:center;
 gap:14px;
 text-align:left;
 padding:12px 15px;
 background:transparent;
 color:var(--text);
 border:0;
 border-bottom:1px solid var(--line);
}
.cell:last-child{border-bottom:0}
.cell .label{flex:1;min-width:0}
.cell b{font-size:15px;font-weight:650}
.sub{
 font-size:12px;
 color:var(--muted);
 margin-top:5px;
}
.chevron{
 color:var(--muted);
 font-size:20px;
}
.tile{
 width:40px;
 height:40px;
 display:grid;
 place-items:center;
 border-radius:12px;
 background:var(--panel2);
 color:var(--accent);
 flex:none;
}

.avatar{
 width:52px;
 height:52px;
 display:grid;
 place-items:center;
 flex:none;
 border-radius:50%;
 overflow:hidden;
 background:linear-gradient(135deg,#68cdb4,#4c8ce6);
 color:#fff;
 font-weight:750;
 font-size:22px;
}
.avatar img{
 width:100%;
 height:100%;
 object-fit:cover;
}
.avatar.big{
 width:132px;
 height:132px;
 font-size:48px;
 cursor:zoom-in;
}
.avatar.medium{
 width:90px;
 height:90px;
 font-size:33px;
 cursor:zoom-in;
}
.profile-head{
 text-align:center;
 display:flex;
 align-items:center;
 flex-direction:column;
 padding:24px 0 10px;
}
.profile-head h2{
 font-size:26px;
 margin:15px 0 5px;
}
.verified{
 display:inline-grid;
 place-items:center;
 background:#9666f0;
 color:#fff;
 width:24px;
 height:24px;
 border-radius:50%;
 font-size:15px;
 vertical-align:middle;
}
.owner-tag{
 background:var(--panel2);
 color:var(--purple);
 border-radius:30px;
 padding:9px 16px;
 margin:12px 0;
 font-weight:700;
 font-size:13px;
}
.actions{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
 margin:18px 0;
}
.actions button{
 background:var(--panel);
 border:0;
 border-radius:16px;
 padding:20px 8px;
 color:var(--text);
}
.actions svg{
 display:block;
 margin:0 auto 8px;
 color:var(--accent);
}

.field{margin:15px 0}
.field label{
 display:block;
 color:var(--muted);
 font-size:13px;
 margin:0 0 8px;
}
.field input,
.field textarea,
.search{
 width:100%;
 border:1px solid var(--line);
 border-radius:14px;
 background:var(--panel);
 color:var(--text);
 padding:15px;
 outline:none;
}
.field textarea{min-height:90px}
.search{margin:8px 0}
input::placeholder,
textarea::placeholder{
 color:var(--muted);
}
.primary,.secondary{
 border:0;
 border-radius:14px;
 padding:15px 18px;
 font-weight:700;
}
.primary{
 background:var(--accent);
 color:#fff;
}
.secondary{
 background:var(--panel2);
 color:var(--text);
}
.wide{
 display:block;
 width:100%;
 margin:12px 0;
}
.empty{
 text-align:center;
 color:var(--muted);
 padding:48px 18px;
}
.empty svg{
 width:45px;
 height:45px;
 color:var(--accent);
}
.empty h3{color:var(--text)}
.empty p{
 line-height:1.6;
 font-size:14px;
}
.section-title{
 font-size:12px;
 color:var(--muted);
 margin:24px 8px 8px;
 text-transform:uppercase;
 font-weight:700;
}

.switcher{
 display:flex;
 background:var(--panel);
 border-radius:30px;
 padding:5px;
 width:max-content;
 max-width:100%;
 margin:22px auto;
}
.switcher button{
 background:none;
 color:var(--muted);
 border:0;
 border-radius:25px;
 padding:11px 16px;
}
.switcher button.active{
 background:var(--panel2);
 color:var(--accent);
}
.postgrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:5px;
}
.post{
 position:relative;
 aspect-ratio:1;
}
.post img{
 width:100%;
 height:100%;
 object-fit:cover;
}
.post button{
 position:absolute;
 top:5px;
 right:5px;
 background:#102039dc;
 color:#fff;
 border:0;
 border-radius:7px;
 padding:5px;
 font-size:11px;
}

.chat-screen{
 height:100%;
 display:flex;
 flex-direction:column;
}
.messages{
 flex:1;
 overflow:auto;
 padding:12px;
}
.bubble{
 background:#315f8b;
 color:#fff;
 max-width:83%;
 width:max-content;
 margin:10px 0 10px auto;
 padding:12px;
 border-radius:17px;
 overflow-wrap:anywhere;
}
.bubble time{
 display:block;
 font-size:10px;
 opacity:.7;
 text-align:right;
 margin-top:6px;
}
.sendbar{
 display:flex;
 gap:8px;
 padding:10px;
 background:var(--panel);
}
.sendbar input{
 flex:1;
 min-width:0;
 border:0;
 background:var(--panel2);
 color:var(--text);
 border-radius:12px;
 padding:12px;
}
.sendbar button{
 border:0;
 background:var(--accent);
 color:white;
 border-radius:12px;
 padding:0 15px;
}

#photoViewer{
 position:fixed;
 inset:0;
 z-index:150;
 background:#07101df5;
 display:flex;
 flex-direction:column;
 color:white;
}
.viewerhead{
 padding:18px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.viewerhead button{
 background:none;
 color:white;
 border:0;
 font-size:26px;
}
#photoViewer img{
 max-width:100%;
 max-height:75vh;
 object-fit:contain;
 margin:auto;
 touch-action:pinch-zoom;
}
.viewerfoot{
 padding:20px;
 text-align:center;
}

.premium-hero{
 padding:25px;
 border-radius:22px;
 margin:12px 0;
 background:linear-gradient(135deg,#243451,#7051ad);
 color:white;
}
.premium-hero h2{
 margin:13px 0;
 font-size:26px;
}
.premium-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}
.premium-box{
 background:var(--panel);
 padding:17px;
 border-radius:16px;
}
.premium-box svg{
 color:var(--purple);
 margin-bottom:12px;
}
.premium-box b{
 display:block;
 font-size:13px;
}
.premium-box p{
 font-size:12px;
 color:var(--muted);
}

@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{
  animation:none!important;
  transition:none!important;
 }
}
</style>
</head>

<body>

<div id="app" inert style="visibility:hidden">
 <header id="header"></header>
 <main id="main"></main>
 <nav id="bottom"></nav>
</div>

<div id="photoViewer" hidden>
 <div class="viewerhead">
  <button id="photoClose">✕</button>
  <strong>Фото профиля</strong>
  <span></span>
 </div>
 <img id="photoFull" alt="Фото профиля">
 <div class="viewerfoot">
  <button class="primary" id="photoChange">
   Изменить фото
  </button>
 </div>
</div>

<script>
window.ZippyBootQueue=window.ZippyBootQueue||[];
window.ZippyBootQueue.push(function(zippyStorage){
(function(){
"use strict";

/* ZIPPY 0.2 */

const KEY="zippy_fixed_v01";

const $=id=>document.getElementById(id);

const esc=v=>String(v??"").replace(
 /[&<>"']/g,
 c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c])
);

/* ИКОНКИ */

const icons={
 back:'<path d="M19 12H5m7-7-7 7 7 7"/>',

 chats:'<path d="M20 11a8 8 0 0 1-8 8H7l-4 2 1-5a8 8 0 1 1 16-5Z"/><path d="M8 11h8"/>',

 contacts:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5"/>',

 settings:'<path d="M9.7 3.2h4.6l.6 2.3 2 1.2 2.3-.7 2.3 4-1.8 1.8v2.4l1.8 1.8-2.3 4-2.3-.7-2 1.2-.6 2.3H9.7l-.6-2.3-2-1.2-2.3.7-2.3-4 1.8-1.8v-2.4L2.5 10l2.3-4 2.3.7 2-1.2Z"/><circle cx="12" cy="12" r="3"/>',

 profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',

 plus:'<path d="M12 5v14M5 12h14"/>',

 lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',

 bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 10h18c0-2-3-3-3-10ZM10 22h4"/>',

 palette:'<circle cx="12" cy="12" r="10"/><circle cx="7" cy="10" r="1"/><circle cx="12" cy="6" r="1"/><circle cx="17" cy="10" r="1"/>',

 storage:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 4 18 4 18 0V5M3 12c0 4 18 4 18 0"/>',

 globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2c-6 5-6 15 0 20M12 2c6 5 6 15 0 20"/>',

 crown:'<path d="m2 7 5 4 5-7 5 7 5-4-2 13H4L2 7Z"/>',

 info:'<circle cx="12" cy="12" r="10"/><path d="M12 11v6M12 7h.01"/>',

 image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="2"/><path d="m3 18 6-6 4 4 3-3 5 5"/>',

 folder:'<path d="M3 6h7l2 3h9v11H3V6Z"/>',

 send:'<path d="m22 2-7 20-4-9-9-4 20-7ZM11 13 22 2"/>',

 bolt:'<path d="M13 2 4 13h7l-1 9 10-12h-7V2Z"/>',

 edit:'<path d="M12 20h9M4 17l-.5 4 4-.5L20 8l-3.5-3.5L4 17Z"/>',

 camera:'<path d="M4 7h4l2-3h4l2 3h4v13H4V7Z"/><circle cx="12" cy="13" r="4"/>',

 switch:'<path d="M4 7h16l-4-4m4 4-4 4M20 17H4l4-4m-4 4 4 4"/>',

 shield:'<path d="M12 2 4 5v7c0 5 3 8 8 10 5-2 8-5 8-10V5Z"/><path d="m9 12 2 2 4-4"/>',

 users:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 5a3 3 0 0 1 0 6"/>',

 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>'
};

const ico=n=>`
 <svg class="ico"
 viewBox="0 0 24 24"
 aria-hidden="true">
 ${icons[n]||icons.info}
 </svg>
`;

/* ХРАНЕНИЕ ДАННЫХ */

function read(key,fallback){
 try{
  return JSON.parse(
   zippyStorage.getItem(key)
  )??fallback;
 }catch{
  return fallback;
 }
}

function write(key,value){
 try{
  zippyStorage.setItem(
   key,JSON.stringify(value)
  );
  return true;
 }catch{
  alert("Недостаточно памяти или хранилище недоступно.");
  return false;
 }
}

function clone(value){
 return JSON.parse(JSON.stringify(value));
}

const defaults={
 theme:"dark",
 language:"ru",
 active:"personal",

 profiles:{
  personal:{
   name:"Личный профиль",
   phone:"",
   bio:"Привет! Я в Zippy",
   avatar:"",
   posts:[],
   archive:[],
   premium:false
  },
  owner:{
   name:"Григорий",
   phone:"",
   bio:"Владелец Zippy",
   avatar:"",
   posts:[],
   archive:[],
   premium:true
  }
 },

 chats:{
  personal:[],
  owner:[]
 },

 contacts:{
  personal:[],
  owner:[]
 }
};

let data=read(KEY,null);

if(!data||typeof data!=="object"||Array.isArray(data)){
 data=clone(defaults);
}

for(const key of ["profiles","chats","contacts"]){
 if(!data[key]||
 typeof data[key]!=="object"||
 Array.isArray(data[key])){
  data[key]={};
 }
}

for(const id of ["personal","owner"]){

 data.profiles[id]={
  ...clone(defaults.profiles[id]),
  ...(data.profiles[id]||{})
 };

 if(!Array.isArray(data.profiles[id].posts)){
  data.profiles[id].posts=[];
 }

 if(!Array.isArray(data.profiles[id].archive)){
  data.profiles[id].archive=[];
 }

 if(!Array.isArray(data.chats[id])){
  data.chats[id]=[];
 }

 if(!Array.isArray(data.contacts[id])){
  data.contacts[id]=[];
 }
}

if(!["dark","light","pink","green"].includes(data.theme)){
 data.theme="dark";
}

if(!["personal","owner"].includes(data.active)){
 data.active="personal";
}

const canSwitch=()=>window.ZippyServerRole==="owner" && window.ZippyServerUser?.id==="7ba0a53a-8790-4b6f-b35f-dbf01463d8c9";
 if(!canSwitch()){
 data.active="personal";
 delete data.profiles.owner;
 delete data.chats.owner;
 delete data.contacts.owner;
 }
 const save=()=>write(KEY,data);

const me=()=>data.profiles[data.active];

const isOwner=()=>canSwitch() && data.active==="owner";

const isPremium=()=>
 isOwner()||
 me().premium===true||
 me().isPremium===true||
 me().plan==="premium";

const chats=()=>data.chats[data.active];

const contacts=()=>data.contacts[data.active];

/* НАВИГАЦИЯ */

let tab="chats";
let page="";
let history=[];
let chatIndex=0;
let postTab="posts";
let lastRoute=null;

const app=$("app");
const main=$("main");
const header=$("header");
const bottom=$("bottom");

function avatar(p,size=""){
 return `
 <div class="avatar ${size}" data-avatar="1">
 ${p.avatar
 ?`<img src="${esc(p.avatar)}" alt="">`
 :esc((p.name||"Z")[0])}
 </div>`;
}

function badge(){
 return isOwner()
 ?'<span class="verified">✓</span>'
 :"";
}

function ownerTag(){
 return isOwner()
 ?'<span class="owner-tag">ϟ Владелец Zippy</span>'
 :"";
}

function row(icon,title,action,sub=""){
 return `
 <button class="cell" data-action="${action}">
  <span class="tile">${ico(icon)}</span>
  <span class="label">
   <b>${title}</b>
   ${sub?`<div class="sub">${sub}</div>`:""}
  </span>
  <span class="chevron">›</span>
 </button>`;
}

function head(title,back=false,right=""){
 header.innerHTML=`
 ${back?`
 <button class="iconbtn" data-action="back">
  ${ico("back")}
 </button>`:""}
 <h1>${title}</h1>
 ${right}`;
}

function nav(){

 const tabs=[
  ["chats","Чаты"],
  ["contacts","Контакты"],
  ["settings","Настройки"],
  ["profile","Профиль"]
 ];

 bottom.innerHTML=tabs.map(
 ([id,name])=>`
 <button
 class="navbtn ${tab===id?"active":""}"
 data-tab="${id}">
  ${ico(id)}
  <span>${name}</span>
 </button>`
 ).join("");

 bottom.hidden=page==="chatview";
}

function empty(icon,title,desc){
 return `
 <div class="empty">
  ${ico(icon)}
  <h3>${title}</h3>
  <p>${desc}</p>
 </div>`;
}

function go(p){
 if(page===p)return;
 history.push(page||tab);
 page=p;
 render();
}

function back(){
 const previous=history.pop()||tab;

 if(["chats","contacts","settings","profile"].includes(previous)){
  tab=previous;
  page="";
 }else{
  page=previous;
 }

 render();
}

function setTab(id){
 if(!page&&tab===id&&lastRoute!==null)return;
 tab=id;
 page="";
 history=[];
 render();
}

/* ОСНОВНЫЕ ЭКРАНЫ */

function render(){

 const route=page||tab;
 const changed=route!==lastRoute;

 lastRoute=route;

 app.className=data.theme;

 nav();

 main.style.padding="";

 let html="";

 if(page==="chatview"){

  const c=chats()[chatIndex];

  head(esc(c?.name||"Чат"),true);

  main.style.padding="0";

  html=`
  <div class="chat-screen">

   <div class="messages" id="messages">
   ${(c?.messages||[]).map(m=>`
    <div class="bubble">
     ${esc(m.text)}
     <time>${esc(m.time)}</time>
    </div>
   `).join("")}
   </div>

   <form class="sendbar" id="sendForm">
    <input id="messageInput"
     placeholder="Сообщение…" required>
    <button aria-label="Отправить">
     ${ico("send")}
    </button>
   </form>

  </div>`;

 }else{

 switch(page||tab){

 /* ЧАТЫ */

 case "chats":

 head("Zippy",false,`
 <button class="iconbtn" data-action="search">
  ${ico("search")}
 </button>`);

 html=`
 <input class="search"
  id="chatSearch"
  placeholder="Поиск чатов…">

 <div id="chatList"></div>

 <button class="primary wide"
 data-action="newChat">
  + Новый чат
 </button>`;

 break;

 /* КОНТАКТЫ */

 case "contacts":

 head("Контакты");

 html=`
 <input class="search"
 id="contactSearch"
 placeholder="Поиск контактов…">

 <div class="card">
 ${row("plus","Добавить контакт","newContact")}
 </div>

 <div id="contactList"></div>`;

 break;

 /* НАСТРОЙКИ */

 case "settings":

 head("Настройки");

 html=`
 <div class="profile-head">
  ${avatar(me(),"medium")}
  <h2>${esc(me().name)} ${badge()}</h2>
  <div class="sub">${esc(me().phone)}</div>
  ${ownerTag()}
 </div>

 <div class="card">
  ${row("profile","Аккаунт","account")}
  ${canSwitch()?row("switch","Другой профиль","accounts"):""}
  ${row("lock","Конфиденциальность","privacy")}
  ${row("bell","Уведомления","notifications")}
  ${row("palette","Оформление","appearance")}
  ${row("chats","Настройки чатов","chatsettings")}
  ${row("storage","Память и данные","storage")}
  ${row("globe","Язык","language")}
 </div>

 <div class="card">
  ${!isPremium()
   ?row("crown","Zippy Premium","premium")
   :""}
  ${row("info","О приложении","about")}
 </div>`;

 break;

 /* ПРОФИЛЬ */

 case "profile":

 head("Профиль");

 html=`
 <div class="profile-head">
  ${avatar(me(),"big")}
  <h2>${esc(me().name)} ${badge()}</h2>
  <div class="sub">в сети</div>
  ${ownerTag()}
 </div>

 <div class="actions">

  <button data-action="photo">
   ${ico("camera")}
   Выбрать фото
  </button>

  <button data-action="edit">
   ${ico("edit")}
   Изменить
  </button>

 </div>

function renderChats(query=""){

 const target=$("chatList");

 if(!target)return;

 const list=chats()
 .map((c,i)=>({...c,index:i}))
 .filter(c=>
  String(c.name||"")
  .toLowerCase()
  .includes(query.toLowerCase())
 );

 target.innerHTML=list.length?`

 <div class="card">

 ${list.map(c=>`

 <button class="cell" data-chat="${c.index}">

  <span class="avatar">
   ${esc((c.name||"Z")[0])}
  </span>

  <span class="label">

   <b>${esc(c.name)}</b>

   <div class="sub">
    ${esc(
     (c.messages||[]).slice(-1)[0]?.text
     ||"Новый чат"
    )}
   </div>

  </span>

 </button>

 `).join("")}

 </div>

 `:

 empty(
  "chats",
  "Пока здесь пусто",
  "Сообщения сохраняются только на этом устройстве."
 )+

 `<button class="secondary wide"
 data-tab="contacts">
  Найти друзей
 </button>`;

}

 const target=$("contactList");

 if(!target)return;

 const list=contacts().filter(c=>
  String(c.name||"")
  .toLowerCase()
  .includes(query.toLowerCase())
 );

 target.innerHTML=list.length?`

 <div class="card">

 ${list.map(c=>`

 <div class="cell">

  <span class="avatar">
   ${esc((c.name||"?")[0])}
  </span>

  <span class="label">

   <b>${esc(c.name)}</b>

   <div class="sub">

}

/* ПУБЛИКАЦИИ */

function renderPosts(){

 const target=$("postsArea");

 if(!target)return;

 const list=me()[postTab]||[];

 target.innerHTML=list.length?`

 <div class="postgrid">

 ${list.map((src,i)=>`

 <div class="post">

   ${postTab==="posts"?"В архив":"Вернуть"}

  </button>

 `).join("")}

 `:empty(
  postTab==="posts"?"image":"folder",
  "Пока здесь пусто",
  postTab==="posts"
  ?"Создайте свою первую публикацию."
  :"Здесь будут храниться архивные публикации."
 );

 if(postTab==="posts"){

  target.insertAdjacentHTML(
   "beforeend",
   `<button class="primary wide"
   data-action="addPost">
    + Создать публикацию
   </button>`
  );

 }

}

/* ЗАГРУЗКА ФОТОГРАФИЙ */

function pickImage(callback){

 const input=document.createElement("input");

 input.type="file";
 input.accept="image/*";

 input.onchange=()=>{

  const file=input.files?.[0];

  if(!file)return;

  if(file.size>1200000){
   alert("Выберите фотографию меньше 1,2 МБ.");
   return;
  }

  const reader=new FileReader();

  reader.onload=()=>{
   callback(String(reader.result));
  };

  reader.readAsDataURL(file);

 };

 input.click();

}

/* ПРОСМОТР АВАТАРКИ */

function openPhoto(){

 if(!me().avatar)return;

 $("photoFull").src=me().avatar;
 $("photoViewer").hidden=false;

}

function closePhoto(){

 $("photoViewer").hidden=true;
 $("photoFull").removeAttribute("src");

}

$("photoClose").onclick=closePhoto;

$("photoChange").onclick=()=>{

 closePhoto();

 pickImage(src=>{

  const old=me().avatar;

  me().avatar=src;

  if(!save()){
   me().avatar=old;
  }

  render();

 });

};

document.addEventListener("keydown",e=>{

 if(e.key==="Escape"){
  closePhoto();
 }

});

/* ЕДИНЫЙ ОБРАБОТЧИК КНОПОК */

document.addEventListener("click",e=>{

 const target=e.target;

 if(!(target instanceof Element))return;

 const navButton=target.closest("[data-tab]");

 if(navButton){

  const id=navButton.dataset.tab;

  if(page||tab!==id){
   setTab(id);
  }

  return;

 }

 const theme=target.closest("[data-theme]");

 if(theme){

  const value=theme.dataset.theme;

  if(data.theme!==value){

   data.theme=value;
   save();
   render();

  }

  return;

 }

 const account=target.closest("[data-account]");

 if(account){

  const id=account.dataset.account;

  if(id!=="personal" && !(id==="owner" && canSwitch()))return;

  data.active=id;
  postTab="posts";

  save();

  setTab("profile");

  return;

 }

 const postButton=target.closest("[data-post-tab]");

 if(postButton){

  const value=postButton.dataset.postTab;

  if(postTab===value)return;

  postTab=value;

  renderPosts();

  document.querySelectorAll("[data-post-tab]")
  .forEach(button=>{

   button.classList.toggle(
    "active",
    button.dataset.postTab===postTab
   );

  });

  return;

 }

 const postAction=target.closest("[data-post-action]");

 if(postAction){

  const from=
  postAction.dataset.postAction==="archive"
  ?"posts":"archive";

  const to=from==="posts"?"archive":"posts";

  const index=Number(postAction.dataset.index);

  const item=me()[from].splice(index,1)[0];

  if(item){
   me()[to].push(item);
  }

  save();

  renderPosts();

  return;

 }

 const chat=target.closest("[data-chat]");

 if(chat){

  chatIndex=Number(chat.dataset.chat);

  go("chatview");

  return;

 }

 const avatarTarget=target.closest("[data-avatar]");

 if(
 avatarTarget&&
 avatarTarget.closest(".profile-head")
 ){

  openPhoto();

  return;

 }

 const action=target.closest("[data-action]")
 ?.dataset.action;

 if(!action)return;
 if(action==="serverLogout"){window.ZippySupabase.auth.signOut().then(r=>{if(r.error)alert("Не удалось выйти");else location.reload();});return;} 

 if(action==="back"){

  back();

  return;

 }

 if(action==="search"){

  $("chatSearch")?.focus();

  return;

 }

 if(action==="photo"||action==="addPost"){

  pickImage(src=>{

   if(action==="photo"){

    const old=me().avatar;

    me().avatar=src;

    if(!save()){
     me().avatar=old;
    }

    render();

   }else{

    me().posts.push(src);

    if(!save()){
     me().posts.pop();
    }

    renderPosts();

   }

  });

  return;

 }

 go(action);

});

/* ПОИСК */

document.addEventListener("input",e=>{

 if(e.target.id==="chatSearch"){
  renderChats(e.target.value);
 }

 if(e.target.id==="contactSearch"){
  renderContacts(e.target.value);
 }

});

/* ФОРМЫ */

document.addEventListener("submit",async e=>{

 const id=e.target.id;

 if(![
  "editForm",
  "newChatForm",
  "newContactForm",
  "sendForm"
 ].includes(id))return;

 e.preventDefault();

 const form=new FormData(e.target);

 if(id==="editForm"){

  const newName=String(form.get("name")||"").trim()||me().name;
  const newBio=String(form.get("bio")||"");
  if(!isOwner()){
  const result=await window.ZippySupabase.from("zippy_profiles").update({display_name:newName,bio:newBio}).eq("id",window.ZippyServerUser.id);
  if(result.error){alert("Не удалось сохранить профиль");return;}
  }
  me().name=
   String(form.get("name")||"").trim()
   ||me().name;

  me().bio=String(form.get("bio")||"");

  save();

  setTab("profile");

 }

 if(id==="newChatForm"){

  const name=String(
   form.get("name")||""
  ).trim();

  if(!name)return;

  chats().push({
   name:name,
   messages:[]
  });

  save();

  chatIndex=chats().length-1;

  history=["chats"];
  tab="chats";
  page="chatview";

  render();

 }

 if(id==="newContactForm"){

  const name=String(
   form.get("name")||""
  ).trim();

  if(!name)return;

  contacts().push({

   name:name,

   phone:String(
    form.get("phone")||""
   )

  });

  save();

  setTab("contacts");

 }

 if(id==="sendForm"){

  const input=$("messageInput");

  const text=input.value.trim();

  if(!text)return;

  const current=chats()[chatIndex];

  if(!current)return;

  if(!Array.isArray(current.messages)){
   current.messages=[];
  }

  const message={

   text:text,

   time:new Date().toLocaleTimeString(
    "ru",{
     hour:"2-digit",
     minute:"2-digit"
    }
   )

  };

  current.messages.push(message);

  if(!save()){
   current.messages.pop();
   return;
  }

  const box=$("messages");

  box.insertAdjacentHTML(
   "beforeend",
   `<div class="bubble">
    ${esc(message.text)}
    <time>${esc(message.time)}</time>
   </div>`
  );

  input.value="";

  box.scrollTop=box.scrollHeight;

 }

});

/* ЗАПУСК ZIPPY БЕЗ АВТОРИЗАЦИИ */

render();

})();

});
</script>

const languageIndexes={
 "ru":0,
 "en-US":1,
 "en-GB":2,
 "zh-CN":3,
 "ja":4,
 "fr":5
};

const dictionary=new Map();

translations.forEach(row=>{
 dictionary.set(row[0],row);
});

function t(value){

 const source=String(value??"");

 const row=dictionary.get(source.trim());

 if(!row)return source;

 return row[languageIndexes[currentLanguage]]
 ||row[0];

}

/* =========================================
   4. ПЕРЕВОД ИНТЕРФЕЙСА
========================================= */

const originalTexts=new WeakMap();
const originalAttributes=new WeakMap();

function translateElement(root){

 if(!root)return;

 const walker=document.createTreeWalker(
 root,
 NodeFilter.SHOW_TEXT
 );

 let node;

 while(node=walker.nextNode()){

  const parent=node.parentElement;

  if(!parent)continue;

  if(parent.closest(
   "script,style,textarea,input,.bubble,.z03-user-content"
  ))continue;

  let record=originalTexts.get(node);

  if(!record||node.nodeValue!==record.last){

   const source=node.nodeValue.trim();

   if(!dictionary.has(source))continue;

   record={
    source,
    last:node.nodeValue
   };

  }

  const translated=t(record.source);

  if(node.nodeValue!==translated){
   node.nodeValue=translated;
  }

  record.last=translated;

  originalTexts.set(node,record);

 }

 root.querySelectorAll(
  "[placeholder],[aria-label],[title]"
 ).forEach(element=>{

  let attributes=originalAttributes.get(element)||{};

  for(const name of [
   "placeholder",
   "aria-label",
   "title"
  ]){

   if(!element.hasAttribute(name))continue;

   const value=element.getAttribute(name);

   let record=attributes[name];

   if(!record||value!==record.last){
    record={
     source:value,
     last:value
    };
   }

   const translated=t(record.source);

   if(value!==translated){
    element.setAttribute(name,translated);
   }

   record.last=translated;

   attributes[name]=record;

  }

  originalAttributes.set(element,attributes);

 });

 document.documentElement.lang=currentLanguage;

}

let translationScheduled=false;

function scheduleTranslation(){

 if(translationScheduled)return;

 translationScheduled=true;

 requestAnimationFrame(()=>{

  translationScheduled=false;

  translateElement($("app"));

 });

}

/*
 Наблюдатель не меняет DOM,
 если перевод уже установлен.
 Это предотвращает бесконечные обновления.
*/

const translationObserver=new MutationObserver(
 scheduleTranslation
);

translationObserver.observe($("app"),{
 childList:true,
 subtree:true,
 characterData:true
});

function recommendedLanguage(){

 const locale=String(
  navigator.language||"ru"
 ).toLowerCase();

 if(locale.startsWith("ja"))return "ja";

 if(locale.startsWith("zh"))return "zh-CN";

 if(locale.startsWith("fr"))return "fr";

 if(locale==="en-gb")return "en-GB";

 if(locale.startsWith("en"))return "en-US";

 return "ru";

}

function setLanguage(language){

 if(!languages.some(l=>l.id===language)){
  return;
 }

 currentLanguage=language;

 write(LANG_KEY,language);

 document.documentElement.lang=language;

 renderLanguage();

 scheduleTranslation();

 toast(t("Язык изменён"));

}

function exportData(){

 const backup={

  format:"zippy-backup-v03",

  createdAt:Date.now(),

  developer:dev,

  language:currentLanguage

 };

 const blob=new Blob(

  [JSON.stringify(backup,null,2)],

  {type:"application/json"}

 );

 const url=URL.createObjectURL(blob);

 const link=document.createElement("a");

 link.href=url;

 link.download="Zippy-backup.json";

 link.click();

 setTimeout(()=>URL.revokeObjectURL(url),1000);

}

function importData(){

 const input=document.createElement("input");

 input.type="file";

 input.accept=".json,application/json";

 input.onchange=async()=>{

  const file=input.files?.[0];

  if(!file)return;

  try{

   if(file.size>2000000){
    throw new Error("File too large");
   }

   const backup=JSON.parse(await file.text());

   if(
    backup.format!=="zippy-backup-v03"
    ||!backup.developer
   ){
    throw new Error("Invalid backup");
   }

   const restored={
    ...developerDefaults,
    ...backup.developer
   };

   for(const key of [
    "users",
    "logs",
    "reports",
    "announcements",
    "notifications",
    "releases",
    "channelPosts",
    "sessions"
   ]){

    if(!Array.isArray(restored[key])){
     throw new Error("Invalid data");
    }

   }

   if(!restored.users.every(u=>

    u&&typeof u.id==="string"
    &&typeof u.name==="string"
    &&u.test===true

   )){
    throw new Error("Invalid users");
   }

   if(!confirm(t("Восстановить данные")+"?")){
    return;
   }

   if(!write(DEV_KEY,restored)){
    return;
   }

   dev=restored;

   log("Восстановлена резервная копия");

   renderBackups();

   toast(t("Сохранено"));

  }catch(error){

   alert(error.message);

  }

 };

 input.click();

}

panel.addEventListener("click",event=>{

 const target=event.target.closest(
  "[data-z03-action]"
 );

 if(!target)return;

 const action=target.dataset.z03Action;

 if(action.startsWith("lang:")){

  setLanguage(action.slice(5));

  return;

 }

 if(!isOwner())return;

 if(action.startsWith("page:")){

  openPanel(action.slice(5));

  return;

 }

 if(action.startsWith("user:")){

  selectedUser=action.slice(5);

  openPanel("user");

  return;

 }

 if(action==="create-user"){

  createUser();

  return;

 }

 const user=dev.users.find(
  u=>u.id===selectedUser
 );

 if(action.startsWith("toggle:")&&user){

  const property=action.slice(7);

  if(![
   "premium",
   "verified",
   "admin",
   "blocked",
   "muted"
  ].includes(property))return;

  user[property]=!user[property];

  log(
   property+": "+user[property],
   user.name
  );

  renderUser();

  toast(t("Сохранено"));

  return;

 }

 if(action==="rename-user"&&user){

  const name=prompt(t("Имя"),user.name);

  if(!name||!name.trim())return;

  const old=user.name;

  user.name=name.trim().slice(0,60);

  log("Изменено имя",old+" → "+user.name);

  renderUser();

  return;

 }

 if(action==="delete-user"&&user){

  if(!confirm(
   t("Удалить тестового пользователя")+"?"
  ))return;

  dev.users=dev.users.filter(
   u=>u.id!==user.id
  );

  log("Удалён тестовый пользователь",user.name);

  selectedUser=null;

  currentPage="users";

  renderPanel();

  return;

 }

 if(action.startsWith("delete-record:")){

  const [,type,id]=action.split(":");

  const key=type==="official"
   ?"channelPosts"
   :type==="announcements"
   ?"announcements"
   :"notifications";

  dev[key]=dev[key].filter(
   record=>record.id!==id
  );

  log("Удалена запись",id);

  renderPanel();

  return;

 }

 if(action==="export"){

  exportData();

  return;

 }

 if(action==="import"){

  importData();

  return;

 }

});

    ?selectedUser
    :null

  };

  const key=type==="official"
   ?"channelPosts"

  dev[key].unshift(record);

  log("Создана локальная запись",title);

/* ======================================
   4. НАЗВАНИЯ РАЗДЕЛОВ
====================================== */

const titles={

 developer:"Центр разработчика",
 overview:"Статистика",
 users:"Пользователи",
 activity:"Сессии",
 sessions:"Сессии",
 registrations:"Статистика",

 notifications:"Уведомления",

 official:"Zippy Official",
 logs:"Журнал действий",
 releases:"Обновления",
 server:"Сервер",
 backups:"Резервные копии"

};

const languageIndex={

 "ru":0,
 "en-US":1,
 "en-GB":2,
 "zh-CN":3,
 "ja":4,
 "fr":5

};

const descriptionTitles=[

 "О разделе",
 "About this section",
 "About this section",
 "关于此功能",
 "この機能について",
 "À propos de cette section"

];

function language(){

 return window.Zippy03?.getLanguage?.()
 ||"ru";

}

function translate(text){

 return window.Zippy03?.translate?.(text)
 ||text;

}

/* ======================================
   5. ОПРЕДЕЛЕНИЕ ОТКРЫТОГО РАЗДЕЛА
====================================== */

let activePage="developer";
let pageStack=[];

const panel=document.getElementById(
 "z03-panel"
);

const content=document.getElementById(
 "z03-content"
);

if(!panel||!content){

 console.warn(
  "Zippy 0.3.1 requires Zippy 0.3"
 );

 return;

}

function detectPage(){

 const title=document.getElementById(
  "z03-title"
 )?.textContent.trim();

 if(
  title==="Язык"||
  title===translate("Язык")
 ){
  return "language";
 }

 if(content.querySelector(".z03-user-head")){
  return "user";
 }

 if(
  content.querySelector(
   '[data-z03-action="page:overview"]'
  )
 ){
  return "developer";
 }

 const expected=titles[activePage];

 if(
  expected&&
  (
   title===expected||
   title===translate(expected)
  )
 ){
  return activePage;
 }

 for(const [key,value] of Object.entries(titles)){

  if(
   title===value||
   title===translate(value)
  ){
   return key;
  }

 }

 return activePage;

}

/* ======================================
   6. ЗАМЕНА ИКОНОК
====================================== */

function iconForAction(action){

 if(action.startsWith("page:")){

  return action.slice(5);

 }

 if(action.startsWith("user:")){

  return "user";

 }

 if(action==="rename-user"){

  return "edit";

 }

 if(action==="toggle:premium"){

  return "premium";

 }

 if(action==="toggle:verified"){

  return "verification";

 }

 if(action==="toggle:admin"){

  return "admins";

 }

 if(action==="toggle:blocked"){

  return "lock";

 }

 if(action==="toggle:muted"){

  return "clock";

 }

 return null;

}

function updateIcons(){

 panel.querySelectorAll(
  ".z03-row[data-z03-action]"
 ).forEach(row=>{

  const name=iconForAction(
   row.dataset.z03Action||""
  );

  const element=row.querySelector(
   ".z03-row-icon"
  );

  if(
   element&&
   name&&
   element.dataset.z031Icon!==name
  ){

   element.innerHTML=svg(name);

   element.dataset.z031Icon=name;

  }

 });

 panel.querySelectorAll(
  ".z03-arrow"
 ).forEach(element=>{

  if(element.dataset.z031Ready)return;

  element.innerHTML=svg("chevron");

  element.dataset.z031Ready="1";

 });

 const back=document.getElementById(
  "z03-back"
 );

 if(back&&!back.dataset.z031Ready){

  back.innerHTML=svg("back");

  back.dataset.z031Ready="1";

 }

 if(detectPage()==="developer"){

  const hero=content.querySelector(
   ".z03-hero"
  );

  const logo=hero?.firstElementChild;

  if(
   logo&&
   !logo.classList.contains(
    "z031-hero-logo"
   )
  ){

   logo.className="z031-hero-logo";

   logo.removeAttribute("style");

   logo.innerHTML=svg("official");

  }

 }

}

/* ======================================
   7. ОПИСАНИЕ ВНИЗУ РАЗДЕЛА
====================================== */

function updateDescription(){

 const page=detectPage();

 if(page==="language")return;

 const description=descriptions[page];

 if(!description)return;

 const index=languageIndex[language()]??0;

 const text=description[index];

 const title=descriptionTitles[index];

 let element=content.querySelector(
  ".z031-description"
 );

 if(
  element&&
  element.dataset.page===page&&
  element.dataset.language===language()
 ){
  return;
 }

 if(!element){

  element=document.createElement("div");

  element.className="z031-description";

  content.appendChild(element);

 }

 element.dataset.page=page;

 element.dataset.language=language();

 element.innerHTML=`

 <div class="z031-description-icon">

  ${svg("info")}

 </div>

 <div class="z031-description-body">

  <div class="z031-description-title"></div>

  <div class="z031-description-text"></div>

 </div>

 `;

 element.querySelector(
  ".z031-description-title"
 ).textContent=title;

 element.querySelector(
  ".z031-description-text"
 ).textContent=text;

}

/* ======================================
   8. ОТСЛЕЖИВАНИЕ НАВИГАЦИИ
====================================== */

document.addEventListener("click",event=>{

 if(!(event.target instanceof Element)){
  return;
 }

 const actionButton=event.target.closest(
  "[data-z03-action]"
 );

 const originalButton=event.target.closest(
  "[data-action]"
 );

 if(originalButton?.dataset.action==="admin"){

  activePage="developer";

  pageStack=[];

 }

 if(originalButton?.dataset.action==="language"){

  activePage="language";

  pageStack=[];

 }

 if(actionButton){

  const action=actionButton.dataset.z03Action;

  if(action.startsWith("page:")){

   pageStack.push(activePage);

   activePage=action.slice(5);

  }

  if(action.startsWith("user:")){

   pageStack.push(activePage);

   activePage="user";

  }

  if(action==="create-user"){

   pageStack.push(activePage);

   activePage="user";

  }

  if(action==="delete-user"){

   activePage="users";

  }

 }

 if(event.target.closest("#z03-back")){

  activePage=pageStack.pop()||"developer";

 }

 schedule();

},true);

/* ======================================
   9. ОБНОВЛЕНИЕ НОМЕРА ВЕРСИИ
====================================== */

function updateVersion(){

 const main=document.getElementById("main");

 if(!main)return;

 const heading=document.getElementById(
  "header"
 )?.textContent||"";

 if(
  heading.includes("О приложении")||
  heading.includes(
   translate("О приложении")
  )
 ){

  main.querySelectorAll("p").forEach(p=>{

   if(
    p.textContent.trim()==="Версия 0.2"||
    p.textContent.trim()==="Версия 0.3"
   ){

    const versionLabels=[

     "Версия",
     "Version",
     "Version",
     "版本",
     "バージョン",
     "Version"

    ];

    const index=languageIndex[language()]??0;

    p.textContent=
     versionLabels[index]+" 0.3.1";

   }

  });

 }

}

/* ======================================
   10. ОБНОВЛЕНИЕ БЕЗ ЦИКЛИЧЕСКИХ
       ПЕРЕРИСОВОК
====================================== */

let scheduled=false;

function schedule(){

 if(scheduled)return;

 scheduled=true;

 requestAnimationFrame(()=>{

  scheduled=false;

  if(!panel.hidden){

   updateIcons();

   updateDescription();

  }

  updateVersion();

 });

}

const observer=new MutationObserver(
 schedule
);

observer.observe(panel,{

 childList:true,

 subtree:true,

 characterData:true,

 attributes:true,

 attributeFilter:["hidden"]

});

const main=document.getElementById("main");

if(main){

 observer.observe(main,{

  childList:true,

  subtree:true

 });

}

schedule();

console.log(
 "Zippy 0.3.1 Developer UI installed"
);

})();

});
</script>

/* =====================================
   2. СОЗДАНИЕ SVG
===================================== */

function svg(name){

 return `
 <svg
 class="z032-icon"
 viewBox="0 0 24 24"
 aria-hidden="true"
 focusable="false">

 ${icons[name]||icons.info}

 </svg>
 `;

}

function replaceIcon(element,name){

 if(!element||!icons[name])return;

 if(
  element.dataset.z032Icon===name
  &&element.querySelector(".z032-icon")
 ){
  return;
 }

 element.innerHTML=svg(name);

 element.dataset.z032Icon=name;

}

function replaceSvg(element,name){

 if(!element||!icons[name])return;

 if(element.dataset.z032Icon===name){
  return;
 }

 element.setAttribute(
  "viewBox",
  "0 0 24 24"
 );

 element.innerHTML=icons[name];

 element.dataset.z032Icon=name;

 element.classList.add("z032-icon");

}

/* =====================================
   3. НИЖНЯЯ ПАНЕЛЬ
===================================== */

function updateNavigation(){

 const names={

  chats:"chats",

  contacts:"contacts",

  settings:"settings",

  profile:"profile"

 };

 document.querySelectorAll(
  "#bottom [data-tab]"
 ).forEach(button=>{

  const name=names[button.dataset.tab];

  const oldIcon=button.querySelector("svg");

  if(name&&oldIcon){

   replaceSvg(oldIcon,name);

  }

 });

}

/* =====================================
   4. ИКОНКИ НАСТРОЕК И МЕНЮ
===================================== */

const actionIcons={

 account:"profile",

 privacy:"lock",

 notifications:"bell",

 appearance:"palette",

 chatsettings:"chats",

 storage:"storage",

 language:"language",

 premium:"premium",

 about:"info",

 admin:"shield",

 users:"users",

 roles:"shield",

 restrictions:"lock",

 reports:"info",

 accounts:"switch",

 edit:"edit",

 photo:"camera",

 newContact:"userPlus",

 newChat:"chats",

 addPost:"image",

 search:"search",

 back:"back",

 calls:"phone",

 official:"official",

 archive:"archive",

 updates:"refresh",

 download:"download",

 delete:"trash"

};

function updateMenus(){

 document.querySelectorAll(
  "#app [data-action]"
 ).forEach(button=>{

  const action=button.dataset.action;

  let name=actionIcons[action];

  if(!name)return;

  if(
   action==="account"
   &&button.closest(".card")
   &&button.querySelector(".sub")
  ){

   name="phone";

  }

  const tile=button.querySelector(".tile");

  if(tile){

   replaceIcon(tile,name);

   return;

  }

  const oldIcon=button.querySelector("svg");

  if(oldIcon){

   replaceSvg(oldIcon,name);

  }

 });

 document.querySelectorAll(
  "#app .chevron"
 ).forEach(element=>{

  replaceIcon(element,"chevron");

 });

}

/* =====================================
   5. ПУСТЫЕ ЭКРАНЫ
===================================== */

function updateEmptyScreens(){

 const main=document.getElementById("main");

 if(!main)return;

 const activeTab=document.querySelector(
  "#bottom .navbtn.active"
 )?.dataset.tab;

 main.querySelectorAll(".empty")
 .forEach(element=>{

  const oldIcon=element.querySelector(
   "svg"
  );

  if(!oldIcon)return;

  let name="info";

  if(element.closest("#chatList")){

   name="chats";

  }else if(element.closest("#contactList")){

   name="contacts";

  }else if(element.closest("#postsArea")){

   const activePost=document.querySelector(
    "[data-post-tab].active"
   )?.dataset.postTab;

   name=activePost==="archive"
    ?"archive"
    :"image";

  }else if(activeTab==="chats"){

   name="chats";

  }

  replaceSvg(oldIcon,name);

 });

}

/* =====================================
   6. ГАЛОЧКИ И СТАТУС ВЛАДЕЛЬЦА
===================================== */

function updateBadges(){

 document.querySelectorAll(
  "#app .verified"
 ).forEach(element=>{

  replaceIcon(element,"verification");

 });

 document.querySelectorAll(
  "#app .owner-tag"
 ).forEach(element=>{

  if(element.dataset.z032Ready)return;

  const textNode=Array.from(
   element.childNodes
  ).find(node=>node.nodeType===3);

  if(textNode){

   textNode.nodeValue=textNode.nodeValue
   .replace(/^\s*[ϟ⚡]\s*/,"");

  }

  const holder=document.createElement(
   "span"
  );

  holder.innerHTML=svg("official");

  element.prepend(holder.firstElementChild);

  element.dataset.z032Ready="1";

 });

}

/* =====================================
   7. PREMIUM
===================================== */

function updatePremium(){

 document.querySelectorAll(
  "#main .premium-hero svg"
 ).forEach(element=>{

  replaceSvg(element,"premium");

 });

 const names=[

  "palette",

  "profile",

  "microphone",

  "ai"

 ];

 document.querySelectorAll(
  "#main .premium-box"
 ).forEach((element,index)=>{

  const oldIcon=element.querySelector("svg");

  if(oldIcon){

   replaceSvg(
    oldIcon,
    names[index]||"premium"
   );

  }

 });

}

/* =====================================
   8. ПЕРЕПИСКА
===================================== */

function updateChat(){

 document.querySelectorAll(
  "#app .sendbar button svg"
 ).forEach(element=>{

  replaceSvg(element,"send");

 });

}

/* =====================================
   9. КНОПКИ СОЗДАНИЯ
===================================== */

function updateCreationButtons(){

 const names={

  newChat:"chats",

  addPost:"image",

  newContact:"userPlus"

 };

 document.querySelectorAll(
  "#main button.primary[data-action]"
 ).forEach(button=>{

  const name=names[button.dataset.action];

  if(!name)return;

  if(button.dataset.z032Ready)return;

  /*
   Сохраняем исходный текст кнопки,
   чтобы система языков продолжала
   работать без конфликтов.
  */

  const holder=document.createElement(
   "span"
  );

  holder.className="z032-button-icon";

  holder.innerHTML=svg(name);

  button.prepend(holder);

  button.dataset.z032Ready="1";

 });

}

/* =====================================
   10. ПРОСМОТР ФОТОГРАФИЙ
===================================== */

function updatePhotoViewer(){

 const close=document.getElementById(
  "photoClose"
 );

 if(close){

  replaceIcon(close,"close");

 }

}

/* =====================================
   11. ЛОГОТИП ZIPPY
===================================== */

function updateBrand(){

 const main=document.getElementById("main");

 if(!main)return;

 main.querySelectorAll(".empty > div")
 .forEach(element=>{

  if(element.dataset.z032Brand)return;

  if(element.textContent.trim()!=="ϟ"){
   return;
  }

  element.classList.add("z032-brand");

  element.innerHTML=svg("brand");

  element.dataset.z032Brand="1";

 });

}

/* =====================================
   12. ВЕРСИЯ ПРИЛОЖЕНИЯ
===================================== */

function updateVersion(){

 document.title="Zippy 0.3.2";

 if(window.Zippy03){

  window.Zippy03.version="0.3.2";

 }

 document.querySelectorAll(
  "#main .empty p"
 ).forEach(element=>{

  const value=element.textContent.trim();

  if(
   /^(Версия|Version|版本|バージョン)\s+0\.\d+(\.\d+)?$/
   .test(value)
  ){

   const updated=value.replace(
    /0\.\d+(\.\d+)?$/,
    "0.3.2"
   );

   if(value!==updated){

    element.textContent=updated;

   }

  }

 });

}

/* =====================================
   13. ОБНОВЛЕНИЕ ИНТЕРФЕЙСА
===================================== */

function updateAll(){

 updateNavigation();

 updateMenus();

 updateEmptyScreens();

 updateBadges();

 updatePremium();

 updateChat();

 updateCreationButtons();

 updatePhotoViewer();

 updateBrand();

 updateVersion();

}

/* =====================================
   14. ЗАЩИТА ОТ ЦИКЛИЧЕСКИХ
       ПЕРЕРИСОВОК
===================================== */

let scheduled=false;

function schedule(){

 if(scheduled)return;

 scheduled=true;

 requestAnimationFrame(()=>{

  scheduled=false;

  updateAll();

 });

}

const app=document.getElementById("app");

if(!app){

 console.warn("Zippy 0.3.2: app not found");

 return;

}

const observer=new MutationObserver(
 schedule
);

observer.observe(app,{

 childList:true,

 subtree:true

});

/* =====================================
   15. ЗАПУСК ОБНОВЛЕНИЯ
===================================== */

updateAll();

console.log(
 "Zippy 0.3.2 — Unified Icons installed"
);

})();

});

function svgImage(art,colors){

 const svg=`
 <svg xmlns="http://www.w3.org/2000/svg"
 width="300" height="300"
 viewBox="0 0 300 300">

 <defs>
 <linearGradient id="g"
 x1="0" y1="0" x2="1" y2="1">
 <stop stop-color="${colors[0]}"/>
 <stop offset="1"
 stop-color="${colors[1]}"/>
 </linearGradient>
 </defs>

 <rect width="300" height="300"
 fill="url(#g)"/>

 ${art}

 </svg>`;

 return "data:image/svg+xml;charset=utf-8,"
 +encodeURIComponent(svg);

}

/* =====================================
   8. СОЗДАНИЕ СТАТИЧЕСКОЙ КОПИИ

   Копия используется старой системой
   профилей. Анимация добавляется
   поверх неё новым интерфейсом.
===================================== */

function createSnapshot(config){

 const canvas=document.createElement("canvas");

 canvas.width=320;
 canvas.height=320;

 const ctx=canvas.getContext("2d");

 const colors=
 backgrounds[config.background]
 ||backgrounds[0];

 const fill=ctx.createLinearGradient(
  0,0,320,320
 );

 fill.addColorStop(0,colors[0]);
 fill.addColorStop(1,colors[1]);

 ctx.fillStyle=fill;
 ctx.fillRect(0,0,320,320);

 ctx.font="170px sans-serif";
 ctx.textAlign="center";
 ctx.textBaseline="middle";

 ctx.fillText(config.emoji,160,170);

 return canvas.toDataURL("image/png");

}

function notify(message){

 document.querySelector(".zaToast")?.remove();

 const toast=document.createElement("div");

 toast.className="zaToast";
 toast.textContent=message;

 document.body.appendChild(toast);

 setTimeout(()=>toast.remove(),2200);

}

function saveAvatar(src,config=null){

 const data=getData();

 const id=openedAccount||account();

 if(
  account()!==id||
  !data.profiles?.[id]
 ){
  return;
 }

 const history=getHistory();

 const studio=getStudio();

 const old=data.profiles[id].avatar;

 const oldConfig=studio[id]||null;

 if(!Array.isArray(history[id])){
  history[id]=[];
 }

 if(old&&old!==src){

  history[id]=history[id].filter(
   item=>item.src!==old
  );

  history[id].unshift({

   src:old,

   config:oldConfig,

   time:Date.now()

  });

 }

 history[id]=history[id].slice(0,8);

 data.profiles[id].avatar=src;

 if(config){

  studio[id]={
   ...config,
   source:src
  };

 }else{

  delete studio[id];

 }

 const keys=[
  APP_KEY,
  HISTORY_KEY,
  STUDIO_KEY
 ];

 const previous=keys.map(
  key=>zippyStorage.getItem(key)
 );

 try{

  write(HISTORY_KEY,history);

  write(STUDIO_KEY,studio);

  write(APP_KEY,data);

 }catch(error){

  keys.forEach((key,index)=>{

   try{

    if(previous[index]===null){

     zippyStorage.removeItem(key);

    }else{

     zippyStorage.setItem(
      key,previous[index]
     );

    }

   }catch{}

  });

  notify(tr("error"));

  return;

 }

 */

 location.reload();

}

 $("zaCustomEmoji").oninput=event=>{

  const value=event.target.value.trim();

  if(!value)return;

  const segments=typeof Intl.Segmenter==="function"

   ?Array.from(
    new Intl.Segmenter(undefined,{
     granularity:"grapheme"
    }).segment(value),
    part=>part.segment
   )

   :Array.from(value);

  const first=segments[0];

  if(
   first&&
   /\p{Extended_Pictographic}|\p{Regional_Indicator}/u
   .test(first)
  ){

   draft.emoji=first;

   updatePreview();

  }

 };

}

/* =====================================
   14. ПРЕДПРОСМОТР БЕЗ ПЕРЕРИСОВКИ
===================================== */

function updatePreview(){

 const preview=$("zaLivePreview");

 if(preview){

  preview.innerHTML=avatarMarkup(draft);

 }

 panel.querySelectorAll(
  '[data-za^="background:"]'
 ).forEach(button=>{

  button.classList.toggle(

   "selected",

   Number(
    button.dataset.za.split(":")[1]
   )===draft.background

  );

 });

 panel.querySelectorAll(
  '[data-za^="emoji:"]'
 ).forEach(button=>{

  button.classList.toggle(

   "selected",

   emojis[
    Number(button.dataset.za.split(":")[1])
   ]===draft.emoji

  );

 });

 panel.querySelectorAll(
  '[data-za^="motion:"]'
 ).forEach(button=>{

  const selected=

   button.dataset.za.split(":")[1]
   ===draft.motion;

  button.querySelector(
   ".zaMotionCheck"
  ).innerHTML=selected?icon("check"):"";

 });

}

/* =====================================
   15. ГАЛЕРЕЯ ТЕЛЕФОНА
===================================== */

function choosePhoto(){

 const input=document.createElement("input");

 input.type="file";

 input.accept="image/*";

 input.onchange=()=>{

  const file=input.files?.[0];

  if(!file)return;

  const url=URL.createObjectURL(file);

  const img=new Image();

  img.onload=()=>{

   try{

    const canvas=document.createElement("canvas");

    const scale=Math.min(
     1,
     720/Math.max(img.width,img.height)
    );

    canvas.width=Math.max(
     1,Math.round(img.width*scale)
    );

    canvas.height=Math.max(
     1,Math.round(img.height*scale)
    );

    const ctx=canvas.getContext("2d");

    ctx.fillStyle="#ffffff";

    ctx.fillRect(
     0,0,canvas.width,canvas.height
    );

    ctx.drawImage(
     img,0,0,canvas.width,canvas.height
    );

    const src=canvas.toDataURL(
     "image/jpeg",.88
    );

    saveAvatar(src);

   }catch{

    notify(tr("error"));

   }finally{

    URL.revokeObjectURL(url);

   }

  };

  img.onerror=()=>{

   URL.revokeObjectURL(url);

   notify(tr("error"));

  };

  img.src=url;

 };

 input.click();

}

/* =====================================
   16. ИСТОРИЯ ФОТОГРАФИЙ
===================================== */

function renderHistory(){

 studioPage="history";

 const history=getHistory()[account()]||[];

 show(tr("history"),`

 ${history.length?`

 <div class="zaPresetGrid">

 ${history.map((item,index)=>`

 <div class="zaPreset">

  <div class="zaPresetImage">

    :`<img src="${esc(item.src)}" alt="">`

   }

  </div>

  <div class="zaHistoryActions">

   <button data-za="restore:${index}">

    ${esc(tr("restore"))}

   </button>

   <button class="zaDanger"
   data-za="delete-history:${index}">

    ${icon("remove")}

   </button>

  </div>

 </div>

 `).join("")}

 </div>

 `:`

 <p class="zaNote"
 style="text-align:center;padding:35px 0">

  ${esc(tr("empty"))}

 </p>

 `}

 `);

}

/* =====================================
   17. УПРАВЛЕНИЕ КНОПКАМИ
===================================== */

panel.addEventListener("click",event=>{

 const button=event.target.closest("[data-za]");

 if(!button)return;

 const action=button.dataset.za;

 const [type,value]=action.split(":");

 if(type==="gallery"){

  choosePhoto();

  return;

 }

 if(type==="presets"){

  renderPresets();

  return;

 }

 if(type==="create"){

  const config=getStudio()[account()];

  if(config){

   draft={

    background:config.background,

    emoji:config.emoji,

    motion:config.motion

   };

  }

  renderEditor();

  return;

 }

 if(type==="history"){

  renderHistory();

  return;

 }

 if(type==="remove"){

  if(confirm(tr("confirm"))){

   saveAvatar("");

  }

  return;

 }

 if(type==="preset"){

  const preset=presets[Number(value)];

  if(preset){

   saveAvatar(
    svgImage(preset.art,preset.colors)
   );

  }

  return;

 }

 if(type==="background"){

  draft.background=Number(value);

  updatePreview();

  return;

 }

 if(type==="emoji"){

  draft.emoji=emojis[Number(value)]||"👍";

  updatePreview();

  return;

 }

 if(type==="motion"){

  if(motions.includes(value)){

   draft.motion=value;

   updatePreview();

  }

  return;

 }

 if(type==="save-created"){

  saveAvatar(

   createSnapshot(draft),

   {...draft}

  );

  return;

 }

 if(type==="restore"){

  const item=
   getHistory()[account()]?.[Number(value)];

  if(item){

   saveAvatar(

    item.src,

    item.config||null

   );

  }

  return;

 }

 if(type==="delete-history"){

  if(!confirm(tr("delete")+"?"))return;

  const history=getHistory();

  history[account()]?.splice(
   Number(value),1
  );

  try{

   write(HISTORY_KEY,history);

   renderHistory();

  }catch{

   notify(tr("error"));

  }

 }

});

$("zaBack").onclick=()=>{

 if(studioPage==="menu"){

  closeStudio();

 }else{

  renderMenu();

 }

};

/* =====================================
   18. АНИМАЦИЯ НАСТОЯЩИХ АВАТАРОК
===================================== */

function updateAvatars(){

 const studio=getStudio();

 const configs=Object.values(studio);

 document.querySelectorAll(
  "#app .avatar img"
 ).forEach(img=>{

  const src=img.getAttribute("src");

  const config=configs.find(

   item=>item.source===src

  );

  if(!config)return;

  const avatar=img.closest(".avatar");

  if(!avatar)return;

  if(avatar.querySelector(".zaAnimated")){

   return;

  }

  /*
   Исходное изображение сохраняем
   внутри аватарки, чтобы старый
   просмотр фотографий не сломался.
  */

  img.style.position="absolute";

  img.style.opacity="0";

  img.style.pointerEvents="none";

  avatar.style.position="relative";

  avatar.insertAdjacentHTML(

   "beforeend",

   avatarMarkup(config)

  );

 });

}

/* =====================================
   19. ПРОСМОТР ФОТОГРАФИИ
===================================== */

function updateViewer(){

 const viewer=$("photoViewer");

 if(!viewer)return;

 const button=$("photoChange");

 if(button&&!button.dataset.zaReady){

  button.className="zaViewerMenu";

  button.innerHTML=

   icon("more")
   +`<span>${esc(tr("manage"))}</span>`;

  button.dataset.zaReady="1";

 }

 if(!$("zaViewerMore")){

  const head=viewer.querySelector(
   ".viewerhead"
  );

  if(head){

   const more=document.createElement("button");

   more.id="zaViewerMore";

   more.innerHTML=icon("more");

   const last=head.lastElementChild;

   if(last?.tagName==="SPAN"){

    last.replaceWith(more);

   }else{

    head.appendChild(more);

   }

  }

 }

}

/* =====================================
   20. ПЕРЕХВАТ СТАРЫХ КНОПОК

   Старые обработчики изменения фото
   не запускаются одновременно с
   новым редактором.
===================================== */

document.addEventListener("click",event=>{

 if(!(event.target instanceof Element)){

  return;

 }

 const target=event.target.closest(

  '#photoChange,'+
  '#zaViewerMore,'+
  '[data-action="photo"]'

 );

 if(target){

  event.preventDefault();

  event.stopImmediatePropagation();

  openStudio();

  return;

 }

 const avatar=event.target.closest(

  ".profile-head .avatar"

 );

 if(avatar&&!profile().avatar){

  event.preventDefault();

  event.stopImmediatePropagation();

  openStudio();

 }

},true);

/* =====================================
   21. АНИМАЦИЯ В ПРОСМОТРЕ ФОТО
===================================== */

function updateAnimatedViewer(){

 const viewer=$("photoViewer");

 const photo=$("photoFull");

 if(!viewer||!photo)return;

 const old=$("zaFullAnimated");

 if(viewer.hidden){

  old?.remove();

  photo.style.display="";

  return;

 }

 const p=profile();

 const config=getStudio()[account()];

 if(
  !config||
  config.source!==p.avatar
 ){

  old?.remove();

  photo.style.display="";

  return;

 }

 if(old)return;

 const animated=document.createElement("div");

 animated.id="zaFullAnimated";

 animated.style.cssText=`

 width:min(85vw,380px);

 aspect-ratio:1;

 margin:auto;

 flex-shrink:0;

 `;

 animated.innerHTML=avatarMarkup(config);

 photo.style.display="none";

 photo.insertAdjacentElement(

  "afterend",

  animated

 );

}

/* =====================================
   22. ОБНОВЛЕНИЕ ИНТЕРФЕЙСА
===================================== */

let scheduled=false;

function schedule(){

 if(scheduled)return;

 scheduled=true;

 requestAnimationFrame(()=>{

  scheduled=false;

  updateAvatars();

  updateViewer();

  updateAnimatedViewer();

 });

}

const observer=new MutationObserver(
 schedule
);

observer.observe(app,{

 childList:true,

 subtree:true

});

const viewer=$("photoViewer");

if(viewer){

 observer.observe(viewer,{

  childList:true,

  subtree:true,

  attributes:true,

  attributeFilter:["hidden"]

 });

}

/* =====================================
   23. ВЕРСИЯ
===================================== */

document.title="Zippy 0.3.3";

if(window.Zippy03){

 window.Zippy03.version="0.3.3";

}

/*
 Предыдущий патч устанавливает 0.3.2
 при обновлении интерфейса.
 Синхронизируем заголовок после него.
*/

const titleElement=document.querySelector("title");

if(titleElement){

 new MutationObserver(()=>{

  if(document.title!=="Zippy 0.3.3"){

   document.title="Zippy 0.3.3";

  }

 }).observe(titleElement,{

  childList:true,

  subtree:true

 });

}

schedule();

console.log(
 "Zippy 0.3.3 Avatar Studio installed"
);

})();

});

function updateLightning(){

 const data=getData();

 const ownerAvatar=
  data.profiles?.owner?.avatar;

 document.querySelectorAll(
  ".zaAnimated .zaEmoji"
 ).forEach(element=>{

  if(element.dataset.za34Bolt==="1")return;

  if(element.textContent.trim()!=="⚡")return;

  const inStudio=element.closest("#zaStudio");

  const avatar=element.closest(".avatar");

  const img=avatar?.querySelector("img");

  const inViewer=element.closest(
   "#zaFullAnimated"
  );

  const allowed=

   (inStudio&&isOwner())

   ||

   (
    avatar&&ownerAvatar&&
    img?.getAttribute("src")===ownerAvatar
   )

   ||

   (inViewer&&isOwner());

  if(!allowed)return;

  element.innerHTML=bolt();

  element.dataset.za34Bolt="1";

  element.setAttribute(
   "aria-label",
   "Zippy Lightning"
  );

 });

}

<script>
window.ZippyBootQueue=window.ZippyBootQueue||[];
window.ZippyBootQueue.push(function(zippyStorage){
(function () {

"use strict";

if (window.Zippy035Installed) return;
window.Zippy035Installed = true;

const KEY = "zippy_fixed_v01";

function isOwner() {
 try {
  const data = JSON.parse(
   zippyStorage.getItem(KEY) || "{}"
  );
  return window.ZippyServerRole==="owner" && window.ZippyServerUser?.id==="7ba0a53a-8790-4b6f-b35f-dbf01463d8c9" && data.active==="owner";
 } catch {
  return false;
 }
}

function isLightning(value) {
 return value.replace(/\uFE0F/g, "").trim() === "⚡";
}

function update() {

 const studio = document.getElementById("zaStudio");

 if (!studio) return;

 const owner = isOwner();

 const buttons = Array.from(
  studio.querySelectorAll(".zaEmojiButton")
 );

 buttons.forEach(button => {

  if (!isLightning(button.textContent)) return;

  // Если молния выбрана в обычном профиле,
  // переключаем выбор на другой эмодзи.

  if (!owner && button.classList.contains("selected")) {

   const replacement = buttons.find(item =>
    !isLightning(item.textContent) &&
    !item.hidden
   );

   replacement?.click();

  }

  if (button.hidden === owner) {
   button.hidden = !owner;
  }

  button.disabled = !owner;

 });

 const ownerCard = document.getElementById(
  "za34OwnerCard"
 );

 if (ownerCard && ownerCard.hidden === owner) {
  ownerCard.hidden = !owner;
 }

}

// Запрещаем выбор молнии в обычном профиле.

document.addEventListener("click", event => {

 if (!(event.target instanceof Element)) return;

 const button = event.target.closest(
  ".zaEmojiButton, #za34OwnerChoice"
 );

 if (!button || isOwner()) return;

 if (
  button.id === "za34OwnerChoice" ||
  isLightning(button.textContent)
 ) {
  event.preventDefault();
  event.stopImmediatePropagation();
 }

}, true);

// Проверка перед сохранением аватарки.

document.addEventListener("click", event => {

 if (!(event.target instanceof Element)) return;

 const save = event.target.closest(
  '[data-za="save-created"]'
 );

 if (!save || isOwner()) return;

 const selected = document.querySelector(
  "#zaStudio .zaEmojiButton.selected"
 );

 if (selected && isLightning(selected.textContent)) {

  event.preventDefault();
  event.stopImmediatePropagation();

  update();

  alert(
   "Молния доступна только владельцу Zippy."
  );

 }

}, true);

// Автоматическое обновление интерфейса.

let scheduled = false;

function schedule() {

 if (scheduled) return;

 scheduled = true;

 requestAnimationFrame(() => {

  scheduled = false;

  update();

 });

}

const app = document.getElementById("app");

if (app) {

 const observer = new MutationObserver(schedule);

 observer.observe(app, {
  childList: true,
  subtree: true
 });

}

window.addEventListener("storage", schedule);

document.addEventListener("click", schedule);

update();

console.log("Zippy 0.3.5 — Owner Lightning Fix");

})();

});
</script>

  return window.ZippyGlass.getSettings();

 }

 try{

  const saved=JSON.parse(
   zippyStorage.getItem(KEY)||"{}"
  );

  return {

   enabled:saved.enabled!==false,

   strength:saved.strength??75

  };

 }catch{

  return {

   enabled:true,
   strength:75

  };

 }

}

/* =====================================
   3. ПАНЕЛЬ ПОВЕРХ КОНТЕНТА
===================================== */

let originalLayout=null;

function updateLayout(enabled){

 const app=document.getElementById("app");

 const main=document.getElementById("main");

 const bottom=document.getElementById("bottom");

 if(!app||!main||!bottom)return;

 if(!enabled){

  bottom.classList.remove("z38-floating");

  if(originalLayout){

   app.style.position=
    originalLayout.position;

   main.style.paddingBottom=
    originalLayout.paddingBottom;

   originalLayout=null;

  }

  return;

 }

 if(getComputedStyle(bottom).display==="none"){

  return;

 }

 if(!originalLayout){

  originalLayout={

   position:app.style.position,

   paddingBottom:main.style.paddingBottom

  };

 }

 if(getComputedStyle(app).position==="static"){

  app.style.position="relative";

 }

 bottom.classList.add("z38-floating");

 const height=bottom.offsetHeight||70;

 main.style.paddingBottom=
  (height+32)+"px";

}

/* =====================================
   4. ОПТИЧЕСКАЯ ИНТЕНСИВНОСТЬ
===================================== */

function apply(){

 const settings=getSettings();

 const value=Number(settings.strength);

 const power=Number.isFinite(value)

  ?Math.max(0,Math.min(100,value))/100

  :.75;

 const enabled=
  settings.enabled&&power>0;

 const root=document.documentElement;

 root.style.setProperty(

  "--z38-power",

  power.toFixed(3)

 );

 /*
  При увеличении интенсивности
  повышается прозрачность.

  Яркость и насыщенность цветов
  не увеличиваются.
 */

 root.style.setProperty(

  "--z38-opacity",

  (1-power*.86).toFixed(3)

 );

 /*
  Небольшое размытие.
  Содержимое под стеклом
  должно оставаться видимым.
 */

 root.style.setProperty(

  "--z38-blur",

  (power*3).toFixed(2)+"px"

 );

 root.style.setProperty(

  "--z38-edge",

  (.05+power*.40).toFixed(3)

 );

 root.style.setProperty(

  "--z38-reflection",

  (power*.35).toFixed(3)

 );

 root.style.setProperty(

  "--z38-depth",

  (power*.25).toFixed(3)

 );

 /*
  Отключаем усиление насыщенности
  из предыдущего обновления.
 */

 root.style.setProperty(

  "--zg-saturation",

  "100%"

 );

 root.style.setProperty(

  "--zg-shine",

  "0"

 );

 const displacement=

  document.getElementById(
   "z38-displacement"
  );

 if(displacement){

  displacement.setAttribute(

   "scale",

   (power*22).toFixed(2)

  );

 }

 updateLayout(enabled);

}

/* =====================================
   5. СИНХРОНИЗАЦИЯ С ПОЛЗУНКОМ
===================================== */

let pending=false;

function schedule(){

 if(pending)return;

 pending=true;

 requestAnimationFrame(()=>{

  pending=false;

  apply();

 });

}

document.addEventListener(

 "input",

 event=>{

  if(event.target.id==="zg-range"){

   schedule();

  }

 }

);

document.addEventListener(

 "change",

 event=>{

  if(event.target.id==="zg-toggle"){

   schedule();

  }

 }

);

document.addEventListener(

 "click",

 event=>{

  if(!(event.target instanceof Element)){

   return;

  }

  if(event.target.closest(

   "#zg-reset,[data-theme],[data-tab]"

  )){

   schedule();

  }

 }

);

window.addEventListener(

 "storage",

 event=>{

  if(event.key===KEY){

   schedule();

  }

 }

);

window.addEventListener(

 "resize",

 schedule

);

/* =====================================
   6. ПОДДЕРЖКА ПЕРЕКЛЮЧЕНИЯ ЭКРАНОВ
===================================== */

const main=document.getElementById("main");

if(main){

 const observer=new MutationObserver(

  schedule

 );

 observer.observe(main,{

  childList:true,

  subtree:false

 });

}

/* =====================================
   7. СВЯЗЬ С LIQUID GLASS 0.3.7
===================================== */

if(window.ZippyGlass){

 [
  "enable",
  "disable",
  "setStrength",
  "reset"
 ].forEach(name=>{

  const original=window.ZippyGlass[name];

  if(typeof original!=="function")return;

  window.ZippyGlass[name]=function(...args){

   const result=original.apply(this,args);

   schedule();

   return result;

  };

 });

}

/* =====================================
   8. ЗАПУСК
===================================== */

apply();

console.log(

 "Zippy 0.3.8 — Optical Liquid Glass"

);

})();

});

]);

const ownerLabels = new Set([

 "владелец zippy",

]);

function normalize(value){

 return String(value||"")
  .replace(/\+/g,"")
  .replace(/\s+/g," ")
  .trim()
  .toLowerCase();

}

 const app=document.getElementById("app");

  );

 ).forEach(element=>{

      )===label)return;

);

      ${canWrite()
       ?"Управление каналом"
       :"Официальный канал"}
     </div>

    </span>

   </button>

  </div>

 `);

}

/* Кнопка команды в центре разработчика */

function injectTeam(){

 const content=document.getElementById(
  "z03-content"
 );

 if(!content)return;

 if(!owner()){

  content.querySelector(
   "#z317-team-entry"
  )?.remove();

  return;

 }

 if(content.querySelector(
  "#z317-team-entry"
 ))return;

 content.insertAdjacentHTML("afterbegin",`

  <div class="z03-card"
   id="z317-team-entry">

   <button class="z03-row"
    data-z317="team">

    <span class="z03-row-icon">
     <svg class="ico"
      viewBox="0 0 24 24">
      <circle cx="9" cy="8" r="3"/>
      <path d="M3 21v-3a6 6 0 0 1 12 0v3"/>
      <path d="M17 8h6m-3-3v6"/>
     </svg>
    </span>

    <span class="z03-label">

     <b>Команда Zippy Official</b>

     <small>
      Сотрудники, роли и разрешения
     </small>

    </span>

    <span class="z03-arrow">›</span>

   </button>

  </div>

 `);

}

let scheduled=false;

function sync(){

 if(scheduled)return;

 scheduled=true;

 requestAnimationFrame(()=>{

  scheduled=false;

  injectChat();
  injectTeam();

 });

}

function init(){

 createPanel();

 new MutationObserver(sync).observe(
  document.getElementById("app"),
  {
   childList:true,
   subtree:true
  }
 );

 window.addEventListener("storage",()=>{

  document.getElementById(
   "z317-chat"
  )?.remove();

  sync();
  render();

 });

 document.addEventListener("keydown",e=>{

  if(e.key==="Escape")close();

 });

 sync();

 console.log(
  "Zippy 0.3.17 — Official Team"
 );

}

if(document.readyState==="loading"){

 document.addEventListener(
  "DOMContentLoaded",init,{once:true}
 );

}else{

 init();

}

})();

});
