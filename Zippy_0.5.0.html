<script>
window.ZippyBootQueue=window.ZippyBootQueue||[];
window.ZippyBootQueue.push(function(zippyStorage){
(function(){

"use strict";

if(window.ZippyChannel318)return;
window.ZippyChannel318=true;

const KEY="zippy_fixed_v01";
const DEV="zippy_developer_v03";

let panel;
let attachment=null;
let selectedPost=null;

function read(key){
 try{
  return JSON.parse(
   zippyStorage.getItem(key)
  )||{};
 }catch{
  return {};
 }
}

function save(data){
 try{
  zippyStorage.setItem(
   DEV,JSON.stringify(data)
  );
  return true;
 }catch{
  alert(
   "Не удалось сохранить. Возможно, файл слишком большой."
  );
  return false;
 }
}

function esc(v){
 return String(v??"").replace(
  /[&<>"']/g,
  c=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[c])
 );
}

function active(){
 return read(KEY).active||"personal";
}

function owner(){
 return window.ZippyServerRole==="owner" && window.ZippyServerUser?.id==="7ba0a53a-8790-4b6f-b35f-dbf01463d8c9" && active()==="owner";
}

function role(){
 return owner()
  ?"owner"
  :read(DEV).officialTeam?.[active()];
}

function canWrite(){
 return ["owner","editor","author"]
  .includes(role());
}

function canEdit(p){
 return canWrite()&&(
  role()!=="author"||
  p.author===active()
 );
}

function posts(){
 const p=read(DEV).channelPosts;
 return Array.isArray(p)?p:[];
}

function uid(){
 return globalThis.crypto?.randomUUID?.()
 ||Date.now()+"-"+Math.random();
}

/* ЕДИНЫЙ СТИЛЬ ИКОНОК */

const icons={

 back:'<path d="M19 12H5m7-7-7 7 7 7"/>',

 more:'<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',

 smile:'<circle cx="12" cy="12" r="9"/><path d="M8 14a4 4 0 0 0 8 0M9 9h.01M15 9h.01"/>',

 clip:'<path d="m20 11-8 8a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/>',

 camera:'<rect x="3" y="5" width="18" height="14" rx="4"/><circle cx="12" cy="12" r="4"/>',

 mic:'<rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/>',

 send:'<path d="m22 2-7 20-4-9-9-4 20-7ZM11 13 22 2"/>',

 image:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="2"/><path d="m3 18 6-6 4 4 3-3 5 5"/>',

 video:'<rect x="3" y="5" width="13" height="14" rx="3"/><path d="m16 10 5-3v10l-5-3"/>',

 file:'<path d="M5 3h9l5 5v13H5zM14 3v6h5"/>',

 users:'<circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M17 4a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5"/>',

 pin:'<path d="m8 3 13 13-5 1-4 4-2-7-7-2 4-4zM3 21l7-7"/>',

 edit:'<path d="m4 16 12-12 4 4L8 20H4z"/>',

 trash:'<path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/>',

 bolt:'<path d="M13 1 3 14h8l-1 9 11-14h-8z"/>',

 close:'<path d="m6 6 12 12M18 6 6 18"/>',

 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>'

};

function ico(name){
 return `<svg class="z318-icon"
 viewBox="0 0 24 24">
 ${icons[name]||icons.info}
 </svg>`;
}

function button(icon,action,label){
 return `<button type="button"
 data-z318="${action}"
 aria-label="${label}">
 ${ico(icon)}
 </button>`;
}

function option(icon,action,label){
 return `<button class="z318-option"
 data-z318="${action}">
 ${ico(icon)}
 <span>${label}</span>
 </button>`;
}

/* СОЗДАНИЕ ЭКРАНА КАНАЛА */

function create(){

 if(panel)return;

 panel=document.createElement("section");

 panel.id="z318-channel";
 panel.hidden=true;

 document.getElementById("app")
  .appendChild(panel);

}

function open(){

 create();

 document.getElementById(
  "z317-panel"
 )?.setAttribute("hidden","");

 panel.hidden=false;

 attachment=null;

 panel.innerHTML=`

 <div class="z318-header">

  ${button("back","close","Назад")}

  <div class="z318-logo">
   ${ico("bolt")}
  </div>

  <div class="z318-name"
   data-z318="info">

   <b>
    Zippy Official
    <span class="z318-check">✓</span>
   </b>

   <small>Официальный канал</small>

  </div>

  ${button("more","menu","Управление")}

 </div>

 <div id="z318-pinned" hidden></div>

 <div id="z318-feed"></div>

 <div id="z318-preview" hidden></div>

 ${canWrite()?`

 <form id="z318-form"
  class="z318-compose">

  ${button("smile","emoji","Эмодзи")}

  <textarea id="z318-text"
   rows="1"
   maxlength="6000"
   placeholder="Пост"></textarea>

  ${button("clip","attach","Вложения")}

  ${button("camera","circle","Видеокружок")}

  ${button("mic","voice","Аудио")}

  <button type="submit"
   class="z318-send"
   aria-label="Опубликовать">
   ${ico("send")}
  </button>

 </form>

 `:`

 <div class="z318-readonly">
  Официальный канал Zippy
 </div>

 `}

 <div id="z318-sheet" hidden>
  <div class="z318-sheet-body"
   id="z318-sheet-body">
  </div>
 </div>

 `;

 renderFeed(true);

}

/* ПУБЛИКАЦИИ */

function mediaHTML(p){

 const a=p.attachment;

 if(!a||!a.src)return "";

 const src=esc(a.src);

 if(a.type==="image"){
  return `<img src="${src}"
   alt="Фото публикации">`;
 }

 if(a.type==="video"||
    a.type==="circle"){

  return `<video
   class="${a.type==="circle"
    ?"z318-circle":""}"
   src="${src}"
   controls playsinline
   preload="metadata"></video>`;

 }

 if(a.type==="audio"){

  return `<audio
   src="${src}"
   controls
   preload="metadata"></audio>`;

 }

 return `<a class="z318-file"
  href="${src}"
  download="${esc(a.name)}">
  ${ico("file")}
  ${esc(a.name)}
 </a>`;

}

function renderFeed(scroll=false){

 const feed=document.getElementById(
  "z318-feed"
 );

 if(!feed)return;

 const oldScroll=feed.scrollTop;

 const list=posts().slice().sort(
  (a,b)=>a.time-b.time
 );

 let lastDate="";

 feed.innerHTML=list.map(p=>{

  const date=new Date(p.time);

  const day=date.toLocaleDateString(
   "ru",{
    day:"numeric",
    month:"long"
   }
  );

  const divider=day!==lastDate
   ?`<div class="z318-date">
     ${esc(day)}
    </div>`
   :"";

  lastDate=day;

  const likes=Object.values(
   p.likes||{}
  ).filter(Boolean).length;

  return `

   ${divider}

   <article class="z318-post"
    id="z318-post-${esc(p.id)}">

    <div class="z318-author">
     Zippy Official ✓
    </div>

    ${p.title?`
     <b>${esc(p.title)}</b>
    `:""}

    <div class="z318-message">
     ${esc(p.message||p.text||"")}
    </div>

    ${mediaHTML(p)}

    <div class="z318-time">

     ${date.toLocaleTimeString(
      "ru",{
       hour:"2-digit",
       minute:"2-digit"
      }
     )}

     ${canEdit(p)?`

      <button
       data-z318-post="${esc(p.id)}"
       style="
        border:0;
        background:none;
        color:inherit;
        font-size:19px;
       ">
       ⋯
      </button>

     `:""}

    </div>

   </article>

   <button class="z318-reaction"
    data-z318-like="${esc(p.id)}">
    👍 ${likes||""}
   </button>

  `;

 }).join("")||`

 <div class="empty">
  ${ico("bolt")}
  <h3>Zippy Official</h3>
  <p>Публикаций пока нет</p>
 </div>

 `;

 const pinned=document.getElementById(
  "z318-pinned"
 );

 const pin=list.find(
  p=>p.id===read(DEV).pinnedPost
 );

 pinned.hidden=!pin;

 if(pin){

  pinned.innerHTML=`
   <b>Закреплённый пост</b>
   <span>
    ${esc(
     pin.title||
     pin.message||
     "Вложение"
    )}
   </span>`;

  pinned.dataset.z318Pin=pin.id;

 }

 feed.scrollTop=scroll
  ?feed.scrollHeight
  :oldScroll;

}

/* МЕНЮ И УПРАВЛЕНИЕ */

function sheet(title,html){

 document.getElementById(
  "z318-sheet"
 ).hidden=false;

 document.getElementById(
  "z318-sheet-body"
 ).innerHTML=`

  <h3>${title}</h3>

  ${html}

  ${option("close","hideSheet","Закрыть")}

 `;

}

function hideSheet(){

 const s=document.getElementById(
  "z318-sheet"
 );

 if(s)s.hidden=true;

}

function menu(){

 sheet("Zippy Official",`

  ${option(
   "info","info","Информация о канале"
  )}

  ${owner()?option(
   "users","team","Управление командой"
  ):""}

  ${canWrite()?option(
   "edit","focus","Создать публикацию"
  ):""}

  ${owner()?option(
   "pin","unpin","Открепить публикацию"
  ):""}

 `);

}

function postMenu(id){

 const p=posts().find(
  x=>x.id===id
 );

 if(!p||!canEdit(p))return;

 selectedPost=id;

 sheet("Управление публикацией",`

  ${option(
   "edit","editPost","Редактировать"
  )}

  ${role()!=="author"?option(
   "pin","pinPost","Закрепить"
  ):""}

  ${option(
   "trash","deletePost","Удалить"
  )}

  ${owner()?`
   <p class="sub">
    Автор: ${esc(
     read(KEY).profiles?.[p.author]?.name
     ||p.author||"Владелец"
    )}
   </p>
  `:""}

 `);

}

/* ВЛОЖЕНИЯ */

function chooseFile(type){

 if(!canWrite())return;

 hideSheet();

 const input=document.createElement(
  "input"
 );

 input.type="file";

 input.accept=({

  image:"image/*",
  video:"video/*",
  circle:"video/*",
  audio:"audio/*",
  file:"*/*"

 })[type]||"*/*";

 if(type==="circle"){
  input.setAttribute(
   "capture","user"
  );
 }

 if(type==="audio"){
  input.setAttribute(
   "capture","user"
  );
 }

 input.onchange=()=>{

  const file=input.files?.[0];

  if(!file)return;

  if(file.size>1500000){

   alert(
    "В локальной версии размер вложения ограничен 1,5 МБ."
   );

   return;

  }

  const reader=new FileReader();

  reader.onload=()=>{

   attachment={

    type:type,
    name:file.name,
    src:String(reader.result)

   };

   preview();

  };

  reader.readAsDataURL(file);

 };

 input.click();

}

function preview(){

 const el=document.getElementById(
  "z318-preview"
 );

 if(!el)return;

 el.hidden=!attachment;

 if(!attachment){

  el.innerHTML="";
  return;

 }

 el.innerHTML=`

  ${mediaHTML({attachment})}

  <span>${esc(attachment.name)}</span>

  <button data-z318="removeFile">
   Удалить вложение
  </button>

 `;

}

/* ОТПРАВКА ПОСТА */

function publish(){

 if(!canWrite())return;

 const input=document.getElementById(
  "z318-text"
 );

 const text=input.value.trim();

 if(!text&&!attachment)return;

 const d=read(DEV);

 if(!Array.isArray(d.channelPosts)){
  d.channelPosts=[];
 }

 d.channelPosts.unshift({

  id:uid(),
  title:"",
  message:text,
  author:active(),
  time:Date.now(),
  attachment:attachment,
  likes:{}

 });

 if(!save(d))return;

 input.value="";

 attachment=null;

 preview();

 renderFeed(true);

}

/* ОБРАБОТЧИКИ */

document.addEventListener(
 "submit",e=>{

  if(e.target.id!=="z318-form")return;

  e.preventDefault();

  publish();

 },true
);

window.addEventListener(
 "click",e=>{

  if(!(e.target instanceof Element))
   return;

  /*
   Перехватываем открытие старого
   канала версии 0.3.17.
  */

  if(e.target.closest(
   '[data-z317="channel"]'
  )){

   e.preventDefault();
   e.stopImmediatePropagation();

   open();

   return;

  }

  if(!panel||panel.hidden)return;

  if(!panel.contains(e.target))return;

  const like=e.target.closest(
   "[data-z318-like]"
  );

  if(like){

   const d=read(DEV);

   const p=d.channelPosts?.find(
    x=>x.id===like.dataset.z318Like
   );

   if(!p)return;

   p.likes=p.likes||{};

   p.likes[active()]=
    !p.likes[active()];

   if(save(d))renderFeed();

   return;

  }

  const post=e.target.closest(
   "[data-z318-post]"
  );

  if(post){

   postMenu(post.dataset.z318Post);

   return;

  }

  const pin=e.target.closest(
   "[data-z318-pin]"
  );

  if(pin){

   document.getElementById(
    "z318-post-"+pin.dataset.z318Pin
   )?.scrollIntoView({
    behavior:"smooth",
    block:"center"
   });

   return;

  }

  const btn=e.target.closest(
   "[data-z318]"
  );

  if(!btn)return;

  e.preventDefault();
  e.stopImmediatePropagation();

  const action=btn.dataset.z318;

  if(action==="close"){

   panel.hidden=true;
   return;

  }

  if(action==="menu")menu();

  if(action==="hideSheet")hideSheet();

  if(action==="focus"){

   hideSheet();

   document.getElementById(
    "z318-text"
   )?.focus();

  }

  if(action==="info"){

   sheet("О канале",`

    <div class="profile-head">

const selector=[

 "#z318-sheet",
 "[role='dialog'][aria-modal='true']",
 "[role='menu']",
 "[data-popup]",
 "[data-bottom-sheet]",
 ".modal-overlay",
 ".popup-overlay",
 ".sheet-overlay",
 ".menu-overlay",
 ".context-menu",
 ".dropdown-menu",
 ".bottom-sheet"

].join(",");

const closing=new WeakSet();
const opened=new WeakSet();
const handlers=new WeakMap();

function visible(el){

 if(!el||!el.isConnected)return false;

 if(el.hidden)return false;

 if(el.closest("[hidden]"))return false;

 const css=getComputedStyle(el);

 return css.display!=="none"&&
  css.visibility!=="hidden"&&
  el.getClientRects().length>0;

}

/* Не затрагиваем полноценные экраны */

function allowed(el){

 if(!el)return false;

 if(el.matches(

  "#app,"+
  "#main,"+
  "#bottom,"+
  "#photoViewer,"+
  "#z03-panel,"+
  "#z317-panel,"+
  "#z318-channel"

 ))return false;

 if(el.matches("dialog"))return false;

 return true;

}

/* Находим содержимое меню */

function content(el){

 return el.querySelector(

  ".z318-sheet-body,"+
  ".sheet-body,"+
  ".sheet-content,"+
  ".modal-content,"+
  ".modal-body,"+
  ".popup-content,"+
  ".menu-content,"+
  "[data-menu-content]"

 )||el;

}

/* Ищем оригинальную кнопку закрытия */

function closeButton(el){

 return Array.from(

  el.querySelectorAll("button")

 ).find(button=>{

  const text=button.textContent
   .trim().toLowerCase();

  const action=button.getAttribute(
   "data-z318"
  );

  return action==="hideSheet"||
   text==="закрыть"||
   text==="close";

 });

}

/* Скрываем кнопку, сохраняя её функцию */

function prepare(el){

 if(!allowed(el)||!visible(el))return;

 const button=closeButton(el);

 if(button){

  handlers.set(el,button);

  if(button.dataset.z320CloseHidden!=="1"){

   button.dataset.z320CloseHidden="1";

  }

 }

 if(!opened.has(el)){

  opened.add(el);

  el.classList.add("z320-opening");

  setTimeout(()=>{

   el.classList.remove(
    "z320-opening"
   );

  },230);

 }

}

function dismiss(el){

 if(!visible(el)||closing.has(el))
  return;

 const button=handlers.get(el);

 /*
  Не закрываем неизвестные меню
  принудительно, если у них нет
  известного обработчика закрытия.
 */

 if(
  el.id!=="z318-sheet"&&
  (!button||!button.isConnected)

 closing.add(el);

 el.classList.remove(
  "z320-opening"
 );

 el.classList.add(
  "z320-closing"
 );

   "z320-closing"

  }else if(el.id==="z318-sheet"){

   el.hidden=true;

  }

  closing.delete(el);
  opened.delete(el);

 },reduced?0:160);

}

/* Поиск открытых меню */

function menus(){

 return Array.from(

  document.querySelectorAll(selector)

 ).filter(el=>

  allowed(el)&&visible(el)

 );

}

/* Нажатие за пределами меню */

window.addEventListener(

 "click",event=>{

  if(!(event.target instanceof Element))
   return;

  const list=menus();

  if(!list.length)return;

  const menu=list[list.length-1];

  const body=content(menu);

  if(body.contains(event.target))
   return;

  /*
   Не перехватываем нажатие,
   если меню не поддерживается.
  */

  if(
   menu.id!=="z318-sheet"&&
   !handlers.get(menu)?.isConnected
  )return;

  event.preventDefault();

  event.stopImmediatePropagation();

  dismiss(menu);

 },

 true

);

/* Закрытие клавишей Escape */

window.addEventListener(

 "keydown",event=>{

  if(event.key!=="Escape")return;

  const list=menus();

  if(!list.length)return;

  const menu=list[list.length-1];

  if(
   menu.id!=="z318-sheet"&&
   !handlers.get(menu)?.isConnected
  )return;

  event.preventDefault();

  event.stopImmediatePropagation();

  dismiss(menu);

 },

 true

);

/* Автоматическое подключение новых меню */

let scheduled=false;

function scan(){

 document.querySelectorAll(selector)

 .forEach(el=>{

  if(visible(el)){

   prepare(el);

  }else{

   opened.delete(el);

  }

 });

}

function schedule(){

 if(scheduled)return;

 scheduled=true;

 requestAnimationFrame(()=>{

  scheduled=false;

  scan();

 });

}

const observer=new MutationObserver(
 schedule
);

observer.observe(document.body,{

 childList:true,

});

function error(text){

}

const observer=new MutationObserver(()=>{

 const text=status.textContent.trim();

 if(
  /подключение|проверка сервера|успешный вход/i
  .test(text)
 ){
  status.textContent="";
 }

});

observer.observe(status,{
 childList:true,
 characterData:true,
 subtree:true
});

function timeout(promise){

 let timer;

 return Promise.race([

  promise,

  new Promise((resolve,reject)=>{

   timer=setTimeout(()=>{

    reject(new Error("ZIPPY_TIMEOUT"));

   },120000);

  })

 ]).finally(()=>clearTimeout(timer));

}

async function getClient(){

 const start=Date.now();

 while(!window.ZippySupabase){

  if(Date.now()-start>=120000){
   throw new Error("ZIPPY_TIMEOUT");
  }

  await new Promise(
   resolve=>setTimeout(resolve,300)
  );

 }

 return window.ZippySupabase;

}

form.addEventListener("submit",async e=>{

 e.preventDefault();
 e.stopImmediatePropagation();

 if(busy)return;

 status.textContent="";

 let number=phone.value
  .trim()
  .replace(/[\s()-]/g,"");

 if(/^8\d{10}$/.test(number)){
  number="+7"+number.slice(1);
 }

 if(/^7\d{10}$/.test(number)){
  number="+"+number;
 }

 if(!/^\+[1-9]\d{7,14}$/.test(number)){

  error(
   "Введите номер телефона с кодом страны."
  );

  return;

 }

 if(password.value.length<8){

  error(
   "Пароль должен содержать минимум 8 символов."
  );

  return;

 }

 const register=!$("z40-name").hidden;

 const name=$("z40-name").value.trim();

 if(register&&!name){

  error("Введите имя.");

  return;

 }

 busy=true;
 submit.disabled=true;

 try{

  const result=await timeout((async()=>{

   const client=await getClient();

   if(register){

    return client.auth.signUp({

     phone:number,

     password:password.value,

     options:{
      data:{
       display_name:name
      }
     }

    });

   }

   return client.auth.signInWithPassword({

    phone:number,

    password:password.value

   });

  })());

  if(result.error){
   throw result.error;
  }

  if(!result.data.session){

   error(
    "Для регистрации требуется подтверждение номера."
   );

   return;

  }

  password.value="";

  location.reload();

 }catch(err){

  const message=err.message||"";

  if(
   message==="ZIPPY_TIMEOUT"||
   /fetch|network|timeout/i.test(message)
  ){

   error(
    "Не удалось войти. Попробуйте позже."
   );

  }else if(
   /invalid login credentials/i.test(message)
  ){

   error("Неверный номер телефона или пароль.");

  }else if(
   /already registered|already exists/i.test(message)
  ){

   error("Этот номер уже зарегистрирован.");

  }else if(
   /phone not confirmed/i.test(message)
  ){

   error("Номер телефона не подтверждён.");

  }else{

   error(
    "Не удалось "+
    (register?"зарегистрироваться":"войти")+
    ". Попробуйте позже."
   );

   console.error("Zippy Auth:",err);

  }

 }finally{

  busy=false;
  submit.disabled=false;

 }

},true);

})();

<script>
(()=>{if(document.getElementById('z50'))return;const s=document.createElement('section');s.id='z50';s.hidden=true;s.innerHTML=`<header><button type="button" data-back aria-label="Назад">‹</button><div class="av"></div><div class="person"><b></b><small>Личная переписка</small></div><button type="button" data-unavailable="Аудиозвонки">☎</button><button type="button" data-unavailable="Видеозвонки">▣</button><button type="button" data-menu>⋮</button></header><div class="notice">Локальная переписка — доставка пока не подключена</div><div class="history"></div><div class="emoji" hidden></div><form><button type="button" data-emoji>☺</button><textarea rows="1" maxlength="6000" placeholder="Сообщение"></textarea><button type="button" data-unavailable="Вложения">📎</button><button type="button" data-unavailable="Камера">▣</button><button type="button" data-unavailable="Голосовые сообщения">♩</button><button class="send" type="submit">➤</button></form>`;document.body.append(s);const q=x=>s.querySelector(x),input=q('textarea'),history=q('.history');let key=null,contact=null;function read(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}}function render(){history.replaceChildren();let last='';const messages=read();if(!messages.length){const e=document.createElement('div');e.className='empty';e.textContent='Здесь пока нет сообщений. Начните переписку!';history.append(e)}for(const m of messages){const d=new Date(m.time),day=d.toLocaleDateString('ru-RU');if(day!==last){const e=document.createElement('div');e.className='day';e.textContent=day;history.append(e);last=day}const b=document.createElement('div');b.className='bubble';b.textContent=m.text;const t=document.createElement('small');t.textContent=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+' · локально';b.append(t);history.append(b)}history.scrollTop=history.scrollHeight}function close(){s.hidden=true;key=null;input.blur()}document.addEventListener('click',e=>{const c=e.target.closest('#contactList .cell');if(!c)return;const u=window.ZippyServerUser;if(!u?.id)return;const name=c.querySelector('.label b')?.textContent.trim(),phone=c.querySelector('.sub')?.textContent.trim()||'';if(!name)return;e.preventDefault();e.stopImmediatePropagation();let active='personal';try{active=JSON.parse(localStorage.getItem('zippy-account:'+u.id+':zippy_fixed_v01')||'{}').active||'personal'}catch{}contact={name,phone};key='zippy_chat_050:'+u.id+':'+active+':'+(phone.replace(/\D/g,'')||name);q('.person b').textContent=name;q('.av').textContent=name[0].toUpperCase();input.value='';s.hidden=false;render()},true);q('[data-back]').onclick=close;q('form').onsubmit=e=>{e.preventDefault();if(!key||!input.value.trim())return;const m=read();m.push({text:input.value.trim(),time:Date.now()});try{localStorage.setItem(key,JSON.stringify(m))}catch{alert('Не удалось сохранить сообщение');return}input.value='';render()};q('[data-emoji]').onclick=()=>q('.emoji').hidden=!q('.emoji').hidden;for(const emoji of ['😀','😂','😊','👍','👋','🔥','⚡','🎉']){const b=document.createElement('button');b.type='button';b.textContent=emoji;b.onclick=()=>input.value+=emoji;q('.emoji').append(b)}s.querySelectorAll('[data-unavailable]').forEach(b=>b.onclick=()=>alert(b.dataset.unavailable+' пока не подключены.'));q('[data-menu]').onclick=()=>{if(contact)alert(contact.name+'\n'+contact.phone)};})();
</script>
